<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Signal/Log data flow</title>
  <desc id="desc">Log files are analyzed locally in the browser application, then sent on request to the selected AI API provider. Provider credentials are encrypted in the browser and no log history is stored.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172238"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8af0c2"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="22" fill="#0b1020"/>
  <g font-family="Segoe UI, sans-serif">
    <rect x="40" y="74" width="280" height="190" rx="14" fill="url(#card)" stroke="#344159"/>
    <circle cx="78" cy="116" r="17" fill="#182d2e" stroke="#385c52"/>
    <path d="M78 105v14m-6-6 6 6 6-6m-14 13h16" fill="none" stroke="#8af0c2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="162" fill="#eef2fb" font-size="18" font-weight="700">Локальный файл</text>
    <text x="64" y="191" fill="#97a4b9" font-size="12">Перетаскивание в браузер</text>
    <text x="64" y="213" fill="#97a4b9" font-size="12">До 1 МБ · без сохранения</text>
    <text x="64" y="243" fill="#8af0c2" font-family="Consolas, monospace" font-size="10" letter-spacing="1">ВАШ КОМПЬЮТЕР</text>

    <path d="M338 169h103" fill="none" stroke="#8af0c2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="390" y="148" text-anchor="middle" fill="#8592a8" font-size="10">нажали анализ</text>

    <rect x="455" y="74" width="290" height="190" rx="14" fill="url(#card)" stroke="#344159"/>
    <circle cx="493" cy="116" r="17" fill="#182d2e" stroke="#385c52"/>
    <path d="M485 122v-11m8 11v-16m8 16v-8" fill="none" stroke="#8af0c2" stroke-width="2" stroke-linecap="round"/>
    <text x="479" y="162" fill="#eef2fb" font-size="18" font-weight="700">Signal/Log</text>
    <text x="479" y="191" fill="#97a4b9" font-size="12">Общий формат инцидентов</text>
    <text x="479" y="213" fill="#97a4b9" font-size="12">Ключ расшифрован в памяти</text>
    <text x="479" y="243" fill="#8af0c2" font-family="Consolas, monospace" font-size="10" letter-spacing="1">127.0.0.1 · КЛЮЧ НЕ ЛОГИРУЕТСЯ</text>

    <path d="M763 169h103" fill="none" stroke="#8af0c2" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="815" y="148" text-anchor="middle" fill="#8592a8" font-size="10">HTTPS · по запросу</text>

    <rect x="880" y="74" width="280" height="190" rx="14" fill="url(#card)" stroke="#344159"/>
    <circle cx="918" cy="116" r="17" fill="#182d2e" stroke="#385c52"/>
    <path d="m909 117 6 6 12-14" fill="none" stroke="#8af0c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="904" y="162" fill="#eef2fb" font-size="18" font-weight="700">AI-провайдер</text>
    <text x="904" y="191" fill="#97a4b9" font-size="12">Gemini · OpenAI · Claude</text>
    <text x="904" y="213" fill="#97a4b9" font-size="12">Grok · OpenAI-compatible</text>
    <text x="904" y="243" fill="#8af0c2" font-family="Consolas, monospace" font-size="10" letter-spacing="1">ЗАПРОС ВНЕШНЕМУ СЕРВИСУ</text>

    <rect x="40" y="293" width="1120" height="1" fill="#29354b"/>
    <text x="600" y="326" text-anchor="middle" fill="#8491a8" font-size="11">Логи не сохраняются приложением. Загрузка в выбранный API может передавать чувствительные данные.</text>
  </g>
</svg>
